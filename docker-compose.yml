name: apparelpos

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: apparelpos
      POSTGRES_USER: apparelpos
      POSTGRES_PASSWORD: apparelpos
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"          # host 5434 -> 5432 & 5433 already taken by other stacks
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apparelpos"]
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: dev-secret-change-in-prod
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost:8091,http://localhost:8001"
      POSTGRES_DB: apparelpos
      POSTGRES_USER: apparelpos
      POSTGRES_PASSWORD: apparelpos
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"          # host 8001 -> avoids the CPQ backend's 8000

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8091:80"            # open http://localhost:8091

volumes:
  pgdata:
